---

name: Disk-Space-Check

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '**/*.md'
      - .gitignore
      - ./meta/main.yml

  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '**/*.md'
      - .gitignore

jobs:
  storage-check:
    runs-on: ubuntu-latest
    steps:
    - name: Show disk usage
      run: df -h

    - name: Check /tmp
      run: df -h /tmp

    - name: Check more /tmp
      run: sudo mount | grep /tmp

    - name: Top-level directories
      run: sudo du -h /usr/lib/jvm /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /usr/local/julia* /usr/local/lib/android /usr/local/share/chromium /opt/microsoft /opt/google /opt/az /usr/local/share/powershell /opt/hostedtoolcache | sort -hr | head -n 20

    - name: Aggressive cleanup
      run: |
        # Remove Java (JDKs)
        sudo rm -rf /usr/lib/jvm

        # Remove .NET SDKs
        sudo rm -rf /usr/share/dotnet

        # Remove Swift toolchain
        sudo rm -rf /usr/share/swift

        # Remove Haskell (GHC)
        sudo rm -rf /usr/local/.ghcup

        # Remove Julia
        sudo rm -rf /usr/local/julia*

        # Remove Android SDKs
        sudo rm -rf /usr/local/lib/android

        # Remove Chromium (optional if not using for browser tests)
        sudo rm -rf /usr/local/share/chromium

        # Remove Microsoft/Edge and Google Chrome builds
        sudo rm -rf /opt/microsoft /opt/google

        # Remove Azure CLI
        sudo rm -rf /opt/az

        # Remove PowerShell
        sudo rm -rf /usr/local/share/powershell

        # Remove CodeQL and other toolcaches
        sudo rm -rf /opt/hostedtoolcache

        docker system prune -af || true
        docker builder prune -af || true
        df -h

    - name: Check space before extraction
      run: df -h /tmp

    - name: Get maya installer
      run: curl -L -o /tmp/Autodesk_Maya_2026_3_Update_Linux_64bit.tgz https://efulfillment.autodesk.com/NetSWDLD/prd/2026/MAYA/670B3782-87C3-318C-B63E-B4465F01BD87//Autodesk_Maya_2026_3_Update_Linux_64bit.tgz

    - name: Create tmp maya path
      run: mkdir /tmp/maya_package
    - name: Extract Maya installer
      run: |
        tar -xzvf /tmp/Autodesk_Maya_2026_3_Update_Linux_64bit.tgz -C /tmp/maya_package

    - name: Check space after extraction
      run: df -h /tmp
